[project]
name = "lintforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vamsi krishna", email = "kvamsi.nellore@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "ruff>=0.16.5",
    "typer>=0.27.2",
]

[project.scripts]
lintforge = "lintforge.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.workspace]
members = [
    "examples/original",
    "examples/refracted",
]
